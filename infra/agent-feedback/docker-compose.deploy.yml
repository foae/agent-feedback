# Image-based deployment stack — installed by scripts/deploy.sh over SSH.
# The script streams the image with crane and docker load; the target needs no
# registry credentials. Set FEEDBACK_IMAGE to a full image reference, including
# its tag, for both scripted and manual Compose operations.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: feedback
      POSTGRES_DB: feedback
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 5s
      timeout: 5s
      retries: 10

  feedback:
    image: ${FEEDBACK_IMAGE:?Set FEEDBACK_IMAGE to your full image reference}
    restart: unless-stopped
    ports:
      - "8090:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
