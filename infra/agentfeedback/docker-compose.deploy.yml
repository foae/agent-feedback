# Image-based deployment stack — installed by scripts/deploy.sh over SSH.
# The host pulls the image from the registry (public package or logged in).
# Set AGENTFEEDBACK_IMAGE to a full image reference, including its tag,
# for both scripted and manual Compose operations.
services:
  agentfeedback:
    image: ${AGENTFEEDBACK_IMAGE:?Set AGENTFEEDBACK_IMAGE to your full image reference}
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      # Loopback is the safe default. Set AGENTFEEDBACK_BIND_ADDRESS=0.0.0.0 only
      # when a deliberately configured reverse proxy or firewall fronts it.
      - "${AGENTFEEDBACK_BIND_ADDRESS:-127.0.0.1}:8090:8080"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_PATH: /data/agentfeedback.db
    volumes:
      - agentfeedback-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  agentfeedback-data:
